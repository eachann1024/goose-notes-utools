# AI 审核使用 Codex CLI 与 CODEX_AUTH_JSON（ChatGPT 登录），参考鹅笔记。
# 审核只读默认分支脚本和 PR diff，不执行 PR 代码；沿用原自动合并闸门。
# workflow_dispatch 仅验收审核结果，不触发合并、评论或标签。
# Secret 缺失、审核异常或输出不合法时失败，自动合并仍按原规则拦截。

name: AI review & auto-merge

on:
  workflow_dispatch:
    inputs:
      pr_number:
        description: '同仓库 PR 编号（只读验收，可选已关闭 PR）'
        required: true
        type: string
  pull_request_target:
    types: [opened, reopened, synchronize, ready_for_review, labeled]

permissions: {}

concurrency:
  group: ai-review-${{ github.event.pull_request.number || format('validation-{0}', inputs.pr_number) }}
  cancel-in-progress: true

env:
  AUTOMERGE_LABEL: bot-automerge          # Bot 开 PR 时加这个标签才会自动合并
  BLOCK_LABEL: needs-human                # 不合并时打的标签
  ALLOWED_AUTHORS: eachann1024            # 逗号分隔；只合并这些作者的 PR
  ALLOW_CAUTION: "true"                   # merge_with_caution 不是致命问题，默认放行（用户口径：没有致命问题就合并）
  CHECKS_TIMEOUT_MIN: "20"                # 等其他 CI 的上限，超时不合并
  # 路径规则：以 / 结尾=任意层级目录；以 * 开头=后缀；其他=文件名前缀。
  # 密钥材料按每一段路径匹配，不只看文件名。任一段是 secrets 或 credentials，
  # 或以 .env / id_rsa 开头，或以 .pem / .key / .p12 结尾，一律 needs-human，主人豁免无效。
  # 重命名同时看 filename 和 previous_filename：改入或改出都算。删除的文件同样算。
  # 例如 .github/secrets/production.json、credentials/token.json、.env/local。
  SECRET_PATHS: ".env,secrets,credentials,*.pem,*.key,*.p12,id_rsa"
  # 受保护路径：其他作者或 fork 改到这些路径一律 needs-human。
  # 仓库主人 eachann1024 的同仓库 PR（head.repo.full_name == 本仓库，不是 fork）
  # 且审核结论为 safe_to_merge 时，即使改到这些路径也 squash 自动合并，不要求 bot-automerge 标签。
  # 密钥材料不在这条豁免里。风险、安全疑虑、其他 CI 和可合并状态仍按原规则拦截。
  # 仓库有其他部署配置（如自定义 deploy 脚本目录）就追加到这里。
  PROTECTED_PATHS: ".github/,.pr_agent.toml,.gemini/,.coderabbit.yaml,.greptile/,.env,secrets,credentials,*.pem,*.key,*.p12,id_rsa,deploy/,vercel.json,netlify.toml,fly.toml,wrangler.toml,render.yaml,Dockerfile,docker-compose,compose.yaml,compose.yml,Procfile"

jobs:
  review:
    name: ai-review
    # 只审同仓库分支、作者是仓库主人的非草稿 PR（作者名与 env.ALLOWED_AUTHORS 保持一致）；labeled 事件只在加的是自动合并标签时才触发
    if: >-
      github.event_name == 'pull_request_target' &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.user.login == 'eachann1024' &&
      github.event.pull_request.draft == false &&
      (github.event.action != 'labeled' || github.event.label.name == 'bot-automerge')
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
      issues: write
      pull-requests: write
    steps:
      - name: Checkout review script from default branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false
      - name: Codex review (ChatGPT login)
        id: pragent
        env:
          CODEX_AUTH_JSON: ${{ secrets.CODEX_AUTH_JSON }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          PR: ${{ github.event.pull_request.number }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          bash .github/codex-review/run.sh > "$RUNNER_TEMP/gate-review.json"
      # 审核 JSON 只走 artifact。放进 job/step output 时，多行 Secret 按行掩码会整段丢弃
      # （Skip output 'review' since it may contain secret），闸门会误判成没有审核结果。
      - name: Upload review result
        uses: actions/upload-artifact@v4
        with:
          name: gate-review
          path: ${{ runner.temp }}/gate-review.json
          if-no-files-found: error


  validate:
    name: ai-review-validation
    # 手动验收仅生成审核结果；不调用合并闸门、不写评论或标签。
    if: github.event_name == 'workflow_dispatch' && github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
      pull-requests: read
    steps:
      - name: Checkout trusted review script
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Resolve owned same-repository PR
        id: target
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          PR: ${{ inputs.pr_number }}
        run: |
          python3 - <<'PY'
          import json, os, re, subprocess
          pr, repo = os.environ['PR'], os.environ['REPO']
          if not re.fullmatch(r'[1-9][0-9]*', pr):
              raise SystemExit('PR 编号不合法')
          info = json.loads(subprocess.check_output(['gh', 'api', f'repos/{repo}/pulls/{pr}'], text=True))
          if info['user']['login'] != 'eachann1024' or (info['head'].get('repo') or {}).get('full_name') != repo:
              raise SystemExit('只允许仓库主人的同仓库 PR')
          sha = info['head']['sha']
          if not re.fullmatch(r'[0-9a-f]{40}', sha):
              raise SystemExit('PR 提交不合法')
          with open(os.environ['GITHUB_OUTPUT'], 'a', encoding='utf-8') as output:
              output.write(f'sha={sha}\n')
          PY
      - name: Validate Codex review (read-only)
        env:
          CODEX_AUTH_JSON: ${{ secrets.CODEX_AUTH_JSON }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          PR: ${{ inputs.pr_number }}
          HEAD_SHA: ${{ steps.target.outputs.sha }}
        run: |
          bash .github/codex-review/run.sh > "$RUNNER_TEMP/validated-review.json"
          python3 - <<'PY'
          import json, os
          data = json.load(open(os.environ["RUNNER_TEMP"] + "/validated-review.json", encoding="utf-8"))
          rec = str(data.get("merge_recommendation", "")).strip()
          risk = str(data.get("risk_level", "")).strip().lower()
          if rec not in {"safe_to_merge", "merge_with_caution", "changes_required"}:
              rec = "invalid"
          if risk not in {"low", "medium", "high"}:
              risk = "invalid"
          issues = data.get("key_issues_to_review")
          count = len(issues) if isinstance(issues, list) else 0
          with open(os.environ["GITHUB_STEP_SUMMARY"], "a", encoding="utf-8") as fh:
              fh.write(
                  "## Codex 审核验收\n\n"
                  f"- merge_recommendation: {rec}\n"
                  f"- risk_level: {risk}\n"
                  f"- issues: {count}\n"
              )
          PY
      - name: Upload review result
        uses: actions/upload-artifact@v4
        with:
          name: codex-review-validation
          path: ${{ runner.temp }}/validated-review.json
          if-no-files-found: error
          retention-days: 7

  gate:
    name: ai-merge-gate
    needs: review
    # review 失败/超时也要进来打标签（被新提交取消的旧运行不进来），只处理同仓库 PR
    if: >-
      !cancelled() &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.user.login == 'eachann1024' &&
      github.event.pull_request.draft == false &&
      (github.event.action != 'labeled' || github.event.label.name == 'bot-automerge')
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: write        # 合并 + 删除分支
      pull-requests: write   # 打标签、评论
      issues: write
      checks: read
      statuses: read
      actions: read
    steps:
      - name: Download review result
        id: review_artifact
        if: needs.review.result == 'success'
        continue-on-error: true
        uses: actions/download-artifact@v4
        with:
          name: gate-review
          path: ${{ runner.temp }}/gate-review
      - name: Decide and merge
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          PR: ${{ github.event.pull_request.number }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          AUTHOR: ${{ github.event.pull_request.user.login }}
          HEAD_REPO: ${{ github.event.pull_request.head.repo.full_name }}
          REVIEW_RESULT: ${{ needs.review.result }}
          DOWNLOAD_OUTCOME: ${{ steps.review_artifact.outcome }}
          REVIEW_FILE: ${{ runner.temp }}/gate-review/gate-review.json
        run: |
          python3 - <<'PY'
          import json, os, re, subprocess, sys, time

          env = os.environ
          repo, pr, sha = env["REPO"], env["PR"], env["HEAD_SHA"]
          label, block = env["AUTOMERGE_LABEL"], env["BLOCK_LABEL"]

          def gh(*args, check=True):
              r = subprocess.run(["gh", *args], capture_output=True, text=True)
              if check and r.returncode != 0:
                  print(r.stderr, file=sys.stderr)
                  raise SystemExit(f"gh {' '.join(args[:3])} failed")
              return r.stdout

          def api(path):
              return json.loads(gh("api", path))

          def short(s, n=120):
              s = " ".join(str(s).split())
              return s if len(s) <= n else s[:n - 1] + "…"

          def output_facts(raw, missing_field):
              # 只报元数据。失败信息里不能出现审核原文，否则凭据格式会一直漏。
              text = raw if isinstance(raw, str) else ""
              payload = text.lstrip("\ufeff")
              decoder = json.JSONDecoder()
              objects = 0
              i, n = 0, len(payload)
              while i < n:
                  if payload[i] not in "{[":
                      i += 1
                      continue
                  try:
                      obj, end = decoder.raw_decode(payload, i)
                  except json.JSONDecodeError:
                      i += 1
                      continue
                  if isinstance(obj, dict):
                      objects += 1
                  elif isinstance(obj, list):
                      objects += sum(isinstance(item, dict) for item in obj)
                  i = end if end > i else i + 1
              lines = 0 if payload == "" else len(payload.splitlines())
              return (
                  f"字节 {len(text.encode('utf-8'))}，行数 {lines}，"
                  f"JSON 对象 {objects}，缺少字段 {missing_field}"
              )

          def last_verdict_object(text):
              decoder = json.JSONDecoder()
              found = None
              i, n = 0, len(text)
              while i < n:
                  if text[i] != "{":
                      i += 1
                      continue
                  try:
                      obj, end = decoder.raw_decode(text, i)
                  except json.JSONDecodeError:
                      i += 1
                      continue
                  if isinstance(obj, dict) and "merge_recommendation" in obj:
                      found = obj
                  i = end if end > i else i + 1
              return found

          def load_review():
              # None：审核 job 没成功，没有可解析产物。成功却没有产物或没有结论对象则直接失败。
              result = env.get("REVIEW_RESULT") or ""
              if result != "success":
                  return None
              path = env.get("REVIEW_FILE") or ""
              if not path or not os.path.isfile(path) or os.path.getsize(path) == 0:
                  outcome = env.get("DOWNLOAD_OUTCOME") or "unknown"
                  print(
                      "审核产物缺失：ai-review 已成功，但闸门未下载到产物文件 gate-review.json"
                      f"（download-artifact 结果：{outcome}）。"
                      "审核 JSON 只通过 artifact 传递，不走 job output；"
                      "产物缺失表示上传或下载失败，不是模型给出了空结论。",
                      file=sys.stderr,
                  )
                  sys.exit(1)
              raw = open(path, encoding="utf-8").read().lstrip("\ufeff")
              parsed = last_verdict_object(raw)
              if not isinstance(parsed, dict):
                  print(
                      "审核产物无法解析。" + output_facts(raw, "merge_recommendation"),
                      file=sys.stderr,
                  )
                  sys.exit(1)
              return parsed

          def verdict(review):
              if not isinstance(review, dict):
                  return "无审核结果"
              rec = str(review.get("merge_recommendation", "")).strip()
              risk = str(review.get("risk_level", "")).strip().lower()
              if rec not in {"safe_to_merge", "merge_with_caution", "changes_required"}:
                  rec = "invalid"
              if risk not in {"low", "medium", "high"}:
                  risk = "invalid"
              return f"{rec} / 风险 {risk}"

          def block_merge(reasons):
              gh("label", "create", block, "-R", repo, "--color", "B60205",
                 "--description", "AI 闸门判定需要人工处理", check=False)
              gh("api", "-X", "POST", f"repos/{repo}/issues/{pr}/labels", "-f", f"labels[]={block}", check=False)
              # 结论行已写了建议和风险，要点里优先放具体原因
              reasons = sorted(reasons, key=lambda r: r.startswith(("合并建议为", "风险等级为")))
              lines = [f"- {short(r)}" for r in reasons[:3]]
              if len(reasons) > 3:
                  lines.append(f"- 另有 {len(reasons) - 3} 条，见 Actions 运行摘要")
              body = (f"### 🤖 自动合并已拦截\n结论：{verdict(review)}\n" + "\n".join(lines) +
                      f"\n\n审核提交：`{sha[:7]}`")
              gh("pr", "comment", pr, "-R", repo, "--body", body, check=False)
              print("BLOCKED:", reasons)
              sys.exit(0)

          review = load_review()
          # 摘要只留枚举和条数，不写审核原文。
          try:
              with open(env["GITHUB_STEP_SUMMARY"], "a", encoding="utf-8") as fh:
                  if not isinstance(review, dict):
                      fh.write("## AI 审核结论\n\n无审核结果\n")
                  else:
                      rec_s = str(review.get("merge_recommendation", "")).strip()
                      risk_s = str(review.get("risk_level", "")).strip().lower()
                      if rec_s not in {"safe_to_merge", "merge_with_caution", "changes_required"}:
                          rec_s = "invalid"
                      if risk_s not in {"low", "medium", "high"}:
                          risk_s = "invalid"
                      issue_list = review.get("key_issues_to_review")
                      count = len(issue_list) if isinstance(issue_list, list) else 0
                      fh.write(
                          "## AI 审核结论\n\n"
                          f"- merge_recommendation: {rec_s}\n"
                          f"- risk_level: {risk_s}\n"
                          f"- issues: {count}\n"
                      )
          except Exception:
              pass

          info = api(f"repos/{repo}/pulls/{pr}")
          labels = {l["name"] for l in info["labels"]}
          rec_preview = str(review.get("merge_recommendation", "")).strip() if isinstance(review, dict) else ""
          head_live = ((info.get("head") or {}).get("repo") or {}).get("full_name")
          # 事件上的作者/head 与 pulls API 必须一致，避免只信其中一边。
          owner_safe = (
              env.get("AUTHOR") == "eachann1024"
              and info["user"]["login"] == "eachann1024"
              and env.get("HEAD_REPO") == repo
              and head_live == repo
              and rec_preview == "safe_to_merge"
          )
          # 没有自动合并标签：只审核不合并。主人 + 同仓库 + safe_to_merge 除外。
          if label not in labels and not owner_safe:
              print("no automerge label; review only"); sys.exit(0)
          if owner_safe and label not in labels:
              print("owner safe_to_merge; automerge label not required")
          if info["state"] != "open" or info["head"]["sha"] != sha:
              print("PR closed or head moved; a newer run will handle it"); sys.exit(0)

          reasons = []
          allowed = {a.strip() for a in env["ALLOWED_AUTHORS"].split(",") if a.strip()}
          if info["user"]["login"] not in allowed:
              # 不是仓库主人的 PR：只审不合，也不发评论
              print("author not allowed; review only"); sys.exit(0)

          # 1) 审核 job 失败时没有产物，按失败原因拦截，不再把空 JSON 说成「没有结构化结果」。
          if review is None:
              reasons.append(f"AI 审核未成功完成（{env.get('REVIEW_RESULT') or 'unknown'}），按规则不自动合并")
          else:
              rec = str(review.get("merge_recommendation", "")).strip()
              risk = str(review.get("risk_level", "")).strip().lower()
              # Actions 把 PR-Agent YAML 里的 No 编进 output JSON 时会变成布尔 false，不能当安全疑虑
              sec_raw = review.get("security_concerns", None)
              if isinstance(sec_raw, bool):
                  sec_text = "true" if sec_raw else "false"
                  sec_clear = not sec_raw
              else:
                  sec_text = str(sec_raw or "").strip()
                  low = sec_text.lower()
                  sec_clear = low.startswith("no") or low in {"false", "none", "null"}
              ok_recs = {"safe_to_merge"} | ({"merge_with_caution"} if env["ALLOW_CAUTION"] == "true" else set())
              known_recs = {"safe_to_merge", "merge_with_caution", "changes_required"}
              if rec not in known_recs:
                  reasons.append("合并建议缺失或不在允许集合内")
              elif rec not in ok_recs:
                  reasons.append(f"合并建议为 `{rec}`")
              if risk not in {"low", "medium", "high"}:
                  reasons.append("风险等级缺失或不在允许集合内")
              elif risk not in {"low", "medium"}:
                  reasons.append(f"风险等级为 `{risk}`")
              if sec_raw is None or (not isinstance(sec_raw, bool) and not sec_text):
                  reasons.append("安全审查字段缺失")
              elif not sec_clear:
                  reasons.append("存在安全疑虑")
              # 安全/鉴权/计费/数据/迁移类意见一律转人工
              issues = review.get("key_issues_to_review") or []
              if not isinstance(issues, list):
                  issues = []
              # 不用裸「安全」：建议里的「并发安全/线程安全」不是安全漏洞
              fatal_kw = re.compile(
                  r"安全漏洞|安全隐患|安全问题|安全风险|不安全|安全性|漏洞|注入|泄露|密钥|令牌|凭据|鉴权|认证|授权|越权|权限|计费|扣费|支付|账单|"
                  r"数据(丢失|损坏|泄露|删除|清空|覆盖)|丢数据|迁移|schema|"
                  r"\b(security|vulnerab\w*|injection|secret|credential|authn|authz|authenticat\w*|authoriz\w*|"
                  r"permission|billing|payment|migration|data loss|corrupt\w*)\b", re.I)
              fatal = False
              for it in issues:
                  if isinstance(it, dict):
                      text = f"{it.get('issue_header', '')} {it.get('issue_content', '')}"
                      if fatal_kw.search(text):
                          fatal = True
              if fatal:
                  reasons.append("审核意见涉及安全/鉴权/计费/数据/迁移")
              if rec == "changes_required":
                  n_issues = sum(isinstance(it, dict) for it in issues)
                  reasons.append(f"要改：{n_issues} 条" if n_issues else "要改")
          if any("security" in l.lower() for l in labels):
              reasons.append("PR 带有安全疑虑标签")

          # 2) 密钥材料一律转人工。其余受保护路径：主人同仓库且 safe_to_merge 可以合并。
          files = json.loads(gh("api", "--paginate", "--slurp", f"repos/{repo}/pulls/{pr}/files?per_page=100"))
          changed = [f for page in files for f in page]
          names = [f.get("filename") or "" for f in changed if f.get("filename")]
          # 删除文件的 filename 就是被删路径。重命名还要看 previous_filename，改入或改出都拦截。
          secret_names = []
          seen_secret = set()
          for f in changed:
              for key in ("filename", "previous_filename"):
                  path = f.get(key)
                  if path and path not in seen_secret:
                      seen_secret.add(path)
                      secret_names.append(path)
          secret_pats = [p.strip() for p in env.get("SECRET_PATHS", "").split(",") if p.strip()]
          prot = [p.strip() for p in env["PROTECTED_PATHS"].split(",") if p.strip()]
          if not secret_pats:
              reasons.append("密钥路径规则缺失，按规则不自动合并")
          def protected(n, p):
              base = n.rsplit("/", 1)[-1]
              if p.endswith("/"):
                  return ("/" + n).find("/" + p) >= 0
              if p.startswith("*"):
                  return n.endswith(p[1:])
              return base.startswith(p)
          def is_secret(n):
              # 文件名和前面的每一段都算。只看最后一段会漏掉 .github/secrets/production.json。
              for seg in n.split("/"):
                  if seg and any(protected(seg, p) for p in secret_pats):
                      return True
              return False
          def matched(pats):
              return [n for n in names if any(protected(n, p) for p in pats)]
          secret_hit = [n for n in secret_names if is_secret(n)]
          secret_set = set(secret_hit)
          hit = [n for n in matched(prot) if n not in secret_set]
          if secret_hit:
              reasons.append("改动了密钥材料路径，不能自动合并：" + ", ".join(secret_hit[:10]))
          if hit and owner_safe:
              print("owner safe_to_merge; non-secret protected paths allowed:", ", ".join(hit[:10]))
          elif hit:
              reasons.append("改动了受保护路径：" + ", ".join(hit[:10]))

          if reasons:
              block_merge(reasons)

          # 3) 等同一提交上的其他检查全部结束且全绿（排除本 workflow 自己的 job）
          own = {"ai-review", "ai-merge-gate"}
          deadline = time.time() + int(env["CHECKS_TIMEOUT_MIN"]) * 60
          while True:
              runs = api(f"repos/{repo}/commits/{sha}/check-runs?per_page=100")["check_runs"]
              runs = [r for r in runs if r["name"] not in own]
              status = api(f"repos/{repo}/commits/{sha}/status")
              pending = [r["name"] for r in runs if r["status"] != "completed"] + \
                        [s["context"] for s in status["statuses"] if s["state"] == "pending"]
              bad = [f"{r['name']}={r['conclusion']}" for r in runs
                     if r["status"] == "completed" and r["conclusion"] not in ("success", "skipped", "neutral")] + \
                    [f"{s['context']}={s['state']}" for s in status["statuses"] if s["state"] in ("failure", "error")]
              if bad:
                  block_merge(["其他检查未通过：" + ", ".join(bad[:10])])
              if not pending:
                  break
              if time.time() > deadline:
                  block_merge([f"等待检查超过 {env['CHECKS_TIMEOUT_MIN']} 分钟（{', '.join(pending[:10])}），超时不合并"])
              time.sleep(30)

          # 4) 可合并状态
          for _ in range(10):
              info = api(f"repos/{repo}/pulls/{pr}")
              if info["mergeable"] is not None:
                  break
              time.sleep(6)
          if info["head"]["sha"] != sha:
              print("head moved while waiting; skip"); sys.exit(0)
          if info["mergeable"] is not True:
              block_merge([f"PR 当前不可合并（mergeable={info['mergeable']}, state={info.get('mergeable_state')}），可能有冲突"])

          # 5) 合并：--match-head-commit 保证合并的就是审核过的那个提交
          r = subprocess.run(["gh", "pr", "merge", pr, "-R", repo, "--squash", "--delete-branch",
                              "--match-head-commit", sha], capture_output=True, text=True)
          if r.returncode != 0:
              block_merge([f"合并调用失败：{(r.stderr or r.stdout).strip()[:300]}"])
          gh("pr", "comment", pr, "-R", repo, "--body",
             f"✅ AI 审核通过（{verdict(review)}），已自动合并 `{sha[:7]}`", check=False)
          print("MERGED", repo, pr, sha)
          PY
