<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>A · 侧栏书签</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:opsz,wght@9..40,400;9..40,500;9..40,600&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#1e1e1e}a:hover{color:#1e1e1e}
.slip{transition:transform .32s cubic-bezier(.2,.8,.2,1),box-shadow .32s ease}
.slip:hover{transform:translateY(-2px);box-shadow:0 16px 36px rgba(15,23,42,.14),0 2px 8px rgba(15,23,42,.06)}
.slip:hover .peek{transform:translateY(-6px) rotate(-4deg)}
.peek{transition:transform .4s cubic-bezier(.2,.8,.2,1)}
.navitem:hover{background:#f1f1ef}
.ghost:hover{background:#f1f1ef}
.footer-control:hover,.footer-control:focus-visible{background:#f1f1ef!important;color:#1e1e1e!important}
.footer-control::after{content:attr(data-tooltip);position:absolute;bottom:calc(100% + 8px);left:50%;transform:translateX(-50%);padding:6px 10px;border-radius:8px;background:#1e1e1e;color:#f1f1ef;font-size:12px;line-height:1.5;white-space:nowrap;pointer-events:none;visibility:hidden;opacity:0;z-index:40}
.footer-control:hover::after,.footer-control:focus-visible::after{visibility:visible;opacity:1}
.footer-control-first::after{left:0;transform:none}
.footer-control-theme::after{left:auto;right:0;transform:none}
@media (prefers-reduced-motion:reduce){.slip,.peek{transition:none}.slip:hover,.slip:hover .peek{transform:none}}
</style>
</helmet>
<div style="width: 960px; height: 640px; box-sizing: border-box; display: flex; background: #f7f7f7; font-family: 'DM Sans', 'HarmonyOS Sans SC', 'PingFang SC', system-ui, sans-serif; color: #1e1e1e; overflow: hidden; position: relative">

  <aside style="width: 236px; flex-shrink: 0; box-sizing: border-box; padding: 16px 10px; display: flex; flex-direction: column; gap: 4px; position: relative">
    <div style="display: flex; align-items: center; gap: 8px; padding: 6px 10px 14px">
      <img src="/_blob/d2062acaf0cf8aff4a3469cb378a70e7" alt="" style="width: 22px; height: 22px; border-radius: 6px">
      <span style="font-size: 14px; font-weight: 600">鹅的笔记</span>
    </div>
    <a class="navitem" href="#" style="display: flex; align-items: center; gap: 10px; padding: 8px 10px; border-radius: 8px; font-size: 14px; text-decoration: none; background: #f1f1ef">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#6d6d6d" stroke-width="1.8" stroke-linecap="round" aria-hidden="true"><path d="M5 4h11l3 3v13H5z"></path><path d="M9 10h6M9 14h6"></path></svg>
      读书摘录
    </a>
    <a class="navitem" href="#" style="display: flex; align-items: center; gap: 10px; padding: 8px 10px; border-radius: 8px; font-size: 14px; text-decoration: none">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#6d6d6d" stroke-width="1.8" stroke-linecap="round" aria-hidden="true"><path d="M5 4h11l3 3v13H5z"></path><path d="M9 10h6M9 14h6"></path></svg>
      周会记录
    </a>
    <a class="navitem" href="#" style="display: flex; align-items: center; gap: 10px; padding: 8px 10px; border-radius: 8px; font-size: 14px; text-decoration: none">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#6d6d6d" stroke-width="1.8" stroke-linecap="round" aria-hidden="true"><path d="M5 4h11l3 3v13H5z"></path><path d="M9 10h6M9 14h6"></path></svg>
      项目灵感
    </a>

    <div style="flex-grow: 1"></div>

    <sc-if value="{{ closed }}" hint-placeholder-val="{{ false }}">
      <button type="button" onClick="{{ reopen }}" style="align-self: flex-start; margin: 0 6px; padding: 8px 12px; border: 0; border-radius: 10px; background: transparent; font: inherit; font-size: 14px; color: #6d6d6d; cursor: pointer">已收起 · 点此重看演示</button>
    </sc-if>

    <sc-if value="{{ showSlip }}" hint-placeholder-val="{{ true }}">
      <div style="position: absolute; left: 10px; right: 10px; bottom: 48px; padding-top: 30px; z-index: 20; pointer-events: none">
        <a class="slip" href="https://note.cooool.top/" onClick="{{ dismiss }}" aria-label="前往 Thinkly 官网" style="position: relative; width: 100%; box-sizing: border-box; text-align: left; text-decoration: none; border: 0; cursor: pointer; font: inherit; color: inherit; background: #ffffff; border-radius: 14px; padding: 34px 14px 14px; box-shadow: 0 8px 22px rgba(15,23,42,.08), 0 1px 2px rgba(15,23,42,.04); display: flex; flex-direction: column; gap: 4px; pointer-events: auto">
          <img class="peek" src="/_blob/83cd16d46ea9e338000521612a9093f5" alt="" style="position: absolute; left: 8px; top: -34px; width: 58px; height: 58px; object-fit: contain">
          <span style="font-size: 14px; font-weight: 600; line-height: 1.4">鹅的笔记桌面版来了</span>
          <span style="font-size: 14px; color: #6d6d6d; line-height: 1.5">不开 uTools 也能记</span>
        </a>
        <button type="button" class="ghost" onClick="{{ dismiss }}" aria-label="不再显示" style="position: absolute; right: 8px; top: 40px; width: 28px; height: 28px; border: 0; border-radius: 8px; background: transparent; color: #6d6d6d; cursor: pointer; display: flex; align-items: center; justify-content: center; pointer-events: auto">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"></path></svg>
        </button>
      </div>
    </sc-if>

    <div style="display: flex; align-items: center; justify-content: space-between; gap: 4px; padding-top: 4px; flex-shrink: 0; position: relative; z-index: 30">
      <div style="display: flex; align-items: center; gap: 4px">
        <button type="button" class="footer-control footer-control-first" aria-label="收起侧栏" data-tooltip="收起侧栏" style="position: relative; display: inline-flex; align-items: center; justify-content: center; width: 32px; height: 32px; padding: 0; border: 0; border-radius: 6px; background: transparent; color: #6d6d6d; cursor: pointer; font: inherit">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="3" width="18" height="18" rx="2"></rect><path d="M9 3v18"></path></svg>
        </button>
        <button type="button" class="footer-control" aria-label="垃圾箱" data-tooltip="垃圾箱" style="position: relative; display: inline-flex; align-items: center; justify-content: center; width: 32px; height: 32px; padding: 0; border: 0; border-radius: 6px; background: transparent; color: #6d6d6d; cursor: pointer; font: inherit">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 6h18M19 6l-1 14H6L5 6M9 6V3h6v3M10 10v6M14 10v6"></path></svg>
        </button>
        <button type="button" class="footer-control" aria-label="反馈" data-tooltip="反馈" style="position: relative; display: inline-flex; align-items: center; justify-content: center; width: 32px; height: 32px; padding: 0; border: 0; border-radius: 6px; background: transparent; color: #6d6d6d; cursor: pointer; font: inherit">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"></path></svg>
        </button>
        <button type="button" class="footer-control" aria-label="设置" data-tooltip="设置" style="position: relative; display: inline-flex; align-items: center; justify-content: center; width: 32px; height: 32px; padding: 0; border: 0; border-radius: 6px; background: transparent; color: #6d6d6d; cursor: pointer; font: inherit">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m9.5 3-.5 2-2 1-2-.5-2 3.5L4.5 11v2L3 15l2 3.5 2-.5 2 1 .5 2h5l.5-2 2-1 2 .5 2-3.5-1.5-2v-2L21 9l-2-3.5-2 .5-2-1-.5-2z"></path><circle cx="12" cy="12" r="3"></circle></svg>
        </button>
      </div>
      <button type="button" class="footer-control footer-control-theme" aria-label="主题：浅色模式，点击切换" data-tooltip="浅色模式（点击切换）" style="position: relative; display: inline-flex; align-items: center; justify-content: center; width: 32px; height: 32px; padding: 0; border: 0; border-radius: 6px; background: transparent; color: #6d6d6d; cursor: pointer; font: inherit">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="4"></circle><path d="M12 2v2M12 20v2M2 12h2M20 12h2M4.93 4.93l1.42 1.42M17.65 17.65l1.42 1.42M4.93 19.07l1.42-1.42M17.65 6.35l1.42-1.42"></path></svg>
      </button>
    </div>
  </aside>

  <main style="flex-grow: 1; margin: 8px 8px 8px 0; background: #ffffff; border-radius: 12px; box-shadow: 0 0 0 1px rgba(15,23,42,.03), 0 0 8px rgba(15,23,42,.05); padding: 56px 72px; box-sizing: border-box; display: flex; flex-direction: column; gap: 14px">
    <h1 style="margin: 0; font-size: 24px; font-weight: 600; letter-spacing: -0.01em">读书摘录</h1>
    <p style="margin: 0; font-size: 16px; line-height: 1.7; color: #1e1e1e; max-width: 560px">《写作是最好的自我投资》第三章：先把念头写下来，再决定它值不值得留下。</p>
    <p style="margin: 0; font-size: 16px; line-height: 1.7; color: #1e1e1e; max-width: 560px">记录不是为了整理，而是为了在需要的时候能找回来。</p>
  </main>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":960,"height":640}}'>
class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.state = { closed: false };
  }
  renderVals() {
    const s = this.state;
    return {
      showSlip: !s.closed,
      closed: s.closed,
      dismiss: () => this.setState({ closed: true }),
      reopen: () => this.setState({ closed: false })
    };
  }
}
</script>
</body>
</html>
