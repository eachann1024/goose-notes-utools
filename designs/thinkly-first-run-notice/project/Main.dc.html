<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>A · 侧栏书签</title>

</head>
<body>
<x-dc>
<helmet>
<style>
body{margin:0}
a{color:#1e1e1e}a:hover{color:#1e1e1e}
button{font-family:inherit}
.slip{transition:transform .32s cubic-bezier(.2,.8,.2,1),box-shadow .32s ease}
.slip:hover{transform:translateY(-2px);box-shadow:0 16px 36px rgba(15,23,42,.14),0 2px 8px rgba(15,23,42,.06)}
.navitem:hover{background:#f1f1ef}
.ghost:hover{background:#f1f1ef}
.footer-control:hover,.footer-control:focus-visible{background:#f1f1ef!important;color:#1e1e1e!important}
@media (prefers-reduced-motion:reduce){.slip{transition:none}.slip:hover{transform:none}}
</style>
</helmet>
<div style="width: 960px; height: 640px; box-sizing: border-box; display: flex; background: #f7f7f7; font-family: -apple-system, 'PingFang SC', 'Microsoft YaHei', system-ui, sans-serif; color: #1e1e1e; overflow: hidden; position: relative">

  <aside style="width: 236px; flex-shrink: 0; box-sizing: border-box; padding: 16px 10px; display: flex; flex-direction: column; gap: 4px; position: relative">

      <img src="/_blob/d2062acaf0cf8aff4a3469cb378a70e7" alt="" style="width: 22px; height: 22px; border-radius: 6px">
      <span style="font-size: 13px; font-weight: 600">鹅的笔记</span>
    </div>
    <a class="navitem" href="#" style="display: flex; align-items: center; gap: 10px; padding: 8px 10px; border-radius: 8px; font-size: 13px; text-decoration: none; background: #f1f1ef">
      <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="#6d6d6d" stroke-width="1.8" stroke-linecap="round" aria-hidden="true"><path d="M5 4h11l3 3v13H5z"></path><path d="M9 10h6M9 14h6"></path></svg>
      读书摘录
    </a>
    <a class="navitem" href="#" style="display: flex; align-items: center; gap: 10px; padding: 8px 10px; border-radius: 8px; font-size: 13px; text-decoration: none">
      <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="#6d6d6d" stroke-width="1.8" stroke-linecap="round" aria-hidden="true"><path d="M5 4h11l3 3v13H5z"></path><path d="M9 10h6M9 14h6"></path></svg>
      周会记录
    </a>
    <a class="navitem" href="#" style="display: flex; align-items: center; gap: 10px; padding: 8px 10px; border-radius: 8px; font-size: 13px; text-decoration: none">
      <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="#6d6d6d" stroke-width="1.8" stroke-linecap="round" aria-hidden="true"><path d="M5 4h11l3 3v13H5z"></path><path d="M9 10h6M9 14h6"></path></svg>
      项目灵感
    </a>

    <div style="flex-grow: 1"></div>

    <sc-if value="{{ closed }}" hint-placeholder-val="{{ false }}">
      <button type="button" onClick="{{ reopen }}" style="align-self: flex-start; margin: 0 6px; padding: 8px 12px; border: 0; border-radius: 10px; background: transparent; font: inherit; font-size: 13px; color: #6d6d6d; cursor: pointer">已收起 · 点此重看演示</button>
    </sc-if>

    <sc-if value="{{ showSlip }}" hint-placeholder-val="{{ true }}">
      <div style="position: absolute; left: 10px; right: 10px; bottom: 48px; z-index: 20">
        <section class="slip" aria-label="Block 推荐" style="position: relative; border: 1px solid #e6e6e6; border-radius: 12px; padding: 12px; display: flex; flex-direction: column; gap: 10px; background: #ffffff; box-shadow: 0 8px 22px rgba(15,23,42,.08), 0 1px 2px rgba(15,23,42,.04)">
          <button type="button" class="ghost" onClick="{{ dismiss }}" aria-label="不再显示" style="position: absolute; top: 6px; right: 6px; width: 24px; height: 24px; border: 0; background: transparent; border-radius: 6px; display: inline-flex; align-items: center; justify-content: center; color: #8a8a8a; cursor: pointer"><svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"></path></svg></button>
          <a href="https://block.cooool.top" onClick="{{ dismiss }}" style="display: flex; align-items: center; gap: 10px; text-decoration: none; color: inherit">
            <img src="/_blob/e6cb2df703537b67b36262916ff5467f" alt="" style="width: 32px; height: 32px; border-radius: 8px; flex: none">
            <span style="display: flex; flex-direction: column; gap: 2px; min-width: 0; flex: 1">
              <span style="font-size: 13px; line-height: 18px; font-weight: 600; color: #1e1e1e; white-space: nowrap; padding-right: 16px">鹅的笔记 完全体</span>
              <span style="font-size: 12px; line-height: 16px; color: #6d6d6d; white-space: nowrap">小鹅也梳上背头啦</span>
            </span>
          </a>
          <dl style="margin: 0; display: grid; grid-template-columns: repeat(3, 1fr); gap: 6px">
            <div style="background: #f4f6fa; border-radius: 8px; padding: 6px 4px; display: flex; flex-direction: column; gap: 2px; align-items: center">
              <dd style="margin: 0; font-size: 12px; line-height: 16px; font-weight: 600; color: {{accent}}; font-variant-numeric: tabular-nums; white-space: nowrap">24.5 ms</dd>
              <dt style="font-size: 11px; line-height: 15px; color: #6d6d6d; white-space: nowrap">瞬间打开</dt>
            </div>
            <div style="background: #f4f6fa; border-radius: 8px; padding: 6px 4px; display: flex; flex-direction: column; gap: 2px; align-items: center">
              <dd style="margin: 0; font-size: 12px; line-height: 16px; font-weight: 600; color: {{accent}}; font-variant-numeric: tabular-nums; white-space: nowrap">117 MB</dd>
              <dt style="font-size: 11px; line-height: 15px; color: #6d6d6d; white-space: nowrap">内存</dt>
            </div>
            <div style="background: #f4f6fa; border-radius: 8px; padding: 6px 4px; display: flex; flex-direction: column; gap: 2px; align-items: center">
              <dd style="margin: 0; font-size: 12px; line-height: 16px; font-weight: 600; color: {{accent}}; font-variant-numeric: tabular-nums; white-space: nowrap">27 MB</dd>
              <dt style="font-size: 11px; line-height: 15px; color: #6d6d6d; white-space: nowrap">体积</dt>
            </div>
          </dl>
          <p style="margin: 0; font-size: 12px; line-height: 18px; color: #6d6d6d; white-space: nowrap">10 万块文档即开即写，依然免费<br>我奶的电脑都能秒开!</p>
          <a href="https://block.cooool.top" onClick="{{ dismiss }}" style="height: 32px; border-radius: 8px; background: {{accent}}; color: #ffffff; text-decoration: none; font-size: 12px; font-weight: 500; display: flex; align-items: center; justify-content: center">去看看</a>
        </section>
      </div>
    </sc-if>

    <div style="display: flex; align-items: center; justify-content: space-between; gap: 4px; padding-top: 4px; flex-shrink: 0; position: relative; z-index: 30">
      <div style="display: flex; align-items: center; gap: 4px">
        <button type="button" class="footer-control" aria-label="收起侧栏" style="position: relative; display: inline-flex; align-items: center; justify-content: center; width: 32px; height: 32px; padding: 0; border: 0; border-radius: 6px; background: transparent; color: #6d6d6d; cursor: pointer"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="3" width="18" height="18" rx="2"></rect><path d="M9 3v18"></path></svg></button>
        <button type="button" class="footer-control" aria-label="垃圾箱" style="position: relative; display: inline-flex; align-items: center; justify-content: center; width: 32px; height: 32px; padding: 0; border: 0; border-radius: 6px; background: transparent; color: #6d6d6d; cursor: pointer"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 6h18M19 6l-1 14H6L5 6M9 6V3h6v3M10 10v6M14 10v6"></path></svg></button>
        <button type="button" class="footer-control" aria-label="反馈" style="position: relative; display: inline-flex; align-items: center; justify-content: center; width: 32px; height: 32px; padding: 0; border: 0; border-radius: 6px; background: transparent; color: #6d6d6d; cursor: pointer"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"></path></svg></button>
        <button type="button" class="footer-control" aria-label="设置" style="position: relative; display: inline-flex; align-items: center; justify-content: center; width: 32px; height: 32px; padding: 0; border: 0; border-radius: 6px; background: transparent; color: #6d6d6d; cursor: pointer"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m9.5 3-.5 2-2 1-2-.5-2 3.5L4.5 11v2L3 15l2 3.5 2-.5 2 1 .5 2h5l.5-2 2-1 2 .5 2-3.5-1.5-2v-2L21 9l-2-3.5-2 .5-2-1-.5-2z"></path><circle cx="12" cy="12" r="3"></circle></svg></button>
      </div>
      <button type="button" class="footer-control" aria-label="主题：浅色模式，点击切换" style="position: relative; display: inline-flex; align-items: center; justify-content: center; width: 32px; height: 32px; padding: 0; border: 0; border-radius: 6px; background: transparent; color: #6d6d6d; cursor: pointer"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="4"></circle><path d="M12 2v2M12 20v2M2 12h2M20 12h2M4.93 4.93l1.42 1.42M17.65 17.65l1.42 1.42M4.93 19.07l1.42-1.42M17.65 6.35l1.42-1.42"></path></svg></button>
    </div>
  </aside>

  <main style="flex-grow: 1; margin: 8px 8px 8px 0; background: #ffffff; border-radius: 12px; box-shadow: 0 0 0 1px rgba(15,23,42,.03), 0 0 8px rgba(15,23,42,.05); padding: 56px 72px; box-sizing: border-box; display: flex; flex-direction: column; gap: 14px">
    <h1 style="margin: 0; font-size: 24px; font-weight: 600; letter-spacing: -0.01em">读书摘录</h1>
    <p style="margin: 0; font-size: 16px; line-height: 1.7; color: #1e1e1e; max-width: 560px">《写作是最好的自我投资》第三章：先把念头写下来，再决定它值不值得留下。</p>
    <p style="margin: 0; font-size: 16px; line-height: 1.7; color: #1e1e1e; max-width: 560px">记录不是为了整理，而是为了在需要的时候能找回来。</p>
  </main>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"accent":{"editor":"color","default":"#4a7be6"},"$preview":{"width":960,"height":640}}'>
class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.state = { closed: false };
  }
  renderVals() {
    const s = this.state;
    return {
      accent: this.props.accent ?? '#4a7be6',
      showSlip: !s.closed,
      closed: s.closed,
      dismiss: () => this.setState({ closed: true }),
      reopen: () => this.setState({ closed: false })
    };
  }
}
</script>
</body>
</html>
