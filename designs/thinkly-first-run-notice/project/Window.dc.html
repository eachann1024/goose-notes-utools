<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>C · 窗角小窗</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:opsz,wght@9..40,400;9..40,500;9..40,600&amp;family=DM+Mono&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#1e1e1e}a:hover{color:#1e1e1e}
.card{animation:rise .5s cubic-bezier(.2,.8,.2,1) both}
@keyframes rise{from{opacity:0;transform:translateY(12px) scale(.97)}to{opacity:1;transform:none}}
.pop{animation:pop 6s cubic-bezier(.2,.8,.2,1) infinite}
@keyframes pop{0%,8%{opacity:0;transform:translateY(8px) scale(.9)}16%,84%{opacity:1;transform:none}92%,100%{opacity:0;transform:translateY(-4px) scale(.98)}}
.type{display:inline-block;overflow:hidden;white-space:nowrap;width:0;animation:type 6s steps(9) infinite}
@keyframes type{0%,20%{width:0}52%,100%{width:9em}}
.caret{display:inline-block;width:1.5px;height:12px;background:#6366f1;vertical-align:-2px;animation:blink 1s step-end infinite}
@keyframes blink{50%{opacity:0}}
.keys{animation:keys 6s ease infinite}
@keyframes keys{0%,4%{opacity:0;transform:translateY(4px)}8%,14%{opacity:1;transform:none}18%,100%{opacity:0}}
.pill:hover{box-shadow:0 8px 22px rgba(15,23,42,.14)}
.ghost:hover{background:#f1f1ef}
.primary:hover{background:#5458e8}
@media (prefers-reduced-motion:reduce){.card,.pop,.type,.caret,.keys{animation:none}.type{width:9em}.pop{opacity:1}.keys{opacity:0}}
</style>
</helmet>
<div style="width: 960px; height: 640px; box-sizing: border-box; display: flex; background: #f7f7f7; font-family: 'DM Sans', 'HarmonyOS Sans SC', 'PingFang SC', system-ui, sans-serif; color: #1e1e1e; overflow: hidden; position: relative">

  <aside style="width: 236px; flex-shrink: 0; box-sizing: border-box; padding: 16px 10px; display: flex; flex-direction: column; gap: 4px">
    <div style="display: flex; align-items: center; gap: 8px; padding: 6px 10px 14px">
      <img src="/_blob/d2062acaf0cf8aff4a3469cb378a70e7" alt="" style="width: 22px; height: 22px; border-radius: 6px">
      <span style="font-size: 14px; font-weight: 600">鹅的笔记</span>
    </div>
    <a href="#" style="display: flex; align-items: center; gap: 10px; padding: 8px 10px; border-radius: 8px; font-size: 14px; text-decoration: none; background: #f1f1ef">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#6d6d6d" stroke-width="1.8" stroke-linecap="round" aria-hidden="true"><path d="M5 4h11l3 3v13H5z"></path><path d="M9 10h6M9 14h6"></path></svg>
      周会记录
    </a>
    <a href="#" style="display: flex; align-items: center; gap: 10px; padding: 8px 10px; border-radius: 8px; font-size: 14px; text-decoration: none">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#6d6d6d" stroke-width="1.8" stroke-linecap="round" aria-hidden="true"><path d="M5 4h11l3 3v13H5z"></path><path d="M9 10h6M9 14h6"></path></svg>
      项目灵感
    </a>
  </aside>

  <main style="flex-grow: 1; margin: 8px 8px 8px 0; background: #ffffff; border-radius: 12px; box-shadow: 0 0 0 1px rgba(15,23,42,.03), 0 0 8px rgba(15,23,42,.05); padding: 56px 72px; box-sizing: border-box; display: flex; flex-direction: column; gap: 14px; position: relative">
    <h1 style="margin: 0; font-size: 24px; font-weight: 600; letter-spacing: -0.01em">周会记录</h1>
    <p style="margin: 0; font-size: 16px; line-height: 1.7; max-width: 520px">1. 设计稿评审推迟到周三，需要补充移动端截图。</p>
    <p style="margin: 0; font-size: 16px; line-height: 1.7; max-width: 520px">2. 导出 PDF 的分页问题由前端跟进。</p>

    <sc-if value="{{ open }}" hint-placeholder-val="{{ true }}">
      <div class="card" role="dialog" aria-label="Thinkly 桌面版" style="position: absolute; right: 20px; bottom: 20px; width: 420px; background: #ffffff; border-radius: 18px; box-shadow: 0 16px 36px rgba(15,23,42,.16), 0 2px 8px rgba(15,23,42,.08); overflow: hidden; display: flex; flex-direction: column">
        <div style="position: relative; height: 150px; background: #f1f1ef; overflow: hidden">
          <div style="position: absolute; left: 20px; top: 18px; right: 20px; height: 150px; background: #f7f7f7; border-radius: 10px; box-shadow: 0 0 0 1px rgba(15,23,42,.06); display: flex; gap: 10px; padding: 12px; box-sizing: border-box">
            <div style="width: 70px; display: flex; flex-direction: column; gap: 6px">
              <div style="height: 6px; width: 80%; border-radius: 3px; background: #dbdbdb"></div>
              <div style="height: 6px; width: 64%; border-radius: 3px; background: #dbdbdb"></div>
              <div style="height: 6px; width: 72%; border-radius: 3px; background: #dbdbdb"></div>
            </div>
            <div style="flex-grow: 1; background: #ffffff; border-radius: 8px; padding: 10px; display: flex; flex-direction: column; gap: 6px">
              <div style="height: 7px; width: 40%; border-radius: 3px; background: #1e1e1e; opacity: .75"></div>
              <div style="height: 5px; width: 88%; border-radius: 3px; background: #e6e6e4"></div>
              <div style="height: 5px; width: 76%; border-radius: 3px; background: #e6e6e4"></div>
            </div>
          </div>
          <div class="keys" style="position: absolute; left: 50%; top: 22px; margin-left: -30px; display: flex; gap: 4px; font-family: 'DM Mono', monospace; font-size: 12px">
            <span style="padding: 3px 7px; border-radius: 6px; background: #ffffff; box-shadow: 0 1px 0 #dbdbdb">⌥</span>
            <span style="padding: 3px 7px; border-radius: 6px; background: #ffffff; box-shadow: 0 1px 0 #dbdbdb">N</span>
          </div>
          <div class="pop" style="position: absolute; left: 50%; top: 56px; margin-left: -110px; width: 220px; background: #ffffff; border-radius: 12px; box-shadow: 0 16px 36px rgba(15,23,42,.16), 0 2px 8px rgba(15,23,42,.08); padding: 12px 14px; box-sizing: border-box; display: flex; flex-direction: column; gap: 8px">
            <div style="display: flex; align-items: center; gap: 6px">
              <img src="/_blob/d2062acaf0cf8aff4a3469cb378a70e7" alt="" style="width: 16px; height: 16px; border-radius: 4px">
              <span style="font-size: 12px; color: #6d6d6d">速记</span>
            </div>
            <div style="font-size: 14px; line-height: 1.4"><span class="type">周三前补移动端截图</span><span class="caret"></span></div>
          </div>
        </div>

        <div style="padding: 18px 20px 20px; display: flex; flex-direction: column; gap: 14px">
          <div style="display: flex; flex-direction: column; gap: 6px">
            <h2 style="margin: 0; font-size: 18px; font-weight: 600; line-height: 1.35">念头来时，不必先打开 uTools</h2>
            <p style="margin: 0; font-size: 14px; line-height: 1.65; color: #6d6d6d">Thinkly 是鹅的笔记的桌面版。一个快捷键唤出速记小窗，记下就走；笔记就是你文件夹里的 Markdown。</p>
          </div>
          <div style="display: flex; align-items: center; gap: 8px">
            <a class="primary" href="https://note.cooool.top/" style="display: inline-flex; align-items: center; gap: 6px; padding: 10px 16px; border-radius: 10px; background: #6366f1; color: #ffffff; font-size: 14px; font-weight: 500; text-decoration: none; box-shadow: 0 6px 14px rgba(15,23,42,.12)">
              下载 Thinkly
              <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M7 17L17 7M9 7h8v8"></path></svg>
            </a>
            <button type="button" class="ghost" onClick="{{ fold }}" style="padding: 10px 14px; border: 0; border-radius: 10px; background: transparent; font: inherit; font-size: 14px; color: #6d6d6d; cursor: pointer">稍后</button>
            <div style="flex-grow: 1"></div>
            <button type="button" class="ghost" onClick="{{ dismiss }}" aria-label="不再显示" style="width: 36px; height: 36px; border: 0; border-radius: 10px; background: transparent; color: #6d6d6d; cursor: pointer; display: flex; align-items: center; justify-content: center">
              <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"></path></svg>
            </button>
          </div>
        </div>
      </div>
    </sc-if>

    <sc-if value="{{ folded }}" hint-placeholder-val="{{ false }}">
      <button type="button" class="pill" onClick="{{ unfold }}" aria-label="展开 Thinkly 介绍" style="position: absolute; right: 20px; bottom: 20px; display: flex; align-items: center; gap: 8px; padding: 6px 14px 6px 6px; border: 0; border-radius: 999px; background: #ffffff; box-shadow: 0 8px 22px rgba(15,23,42,.08), 0 1px 2px rgba(15,23,42,.04); font: inherit; font-size: 14px; color: #1e1e1e; cursor: pointer">
        <img src="/_blob/d2062acaf0cf8aff4a3469cb378a70e7" alt="" style="width: 32px; height: 32px; border-radius: 9px">
        桌面版 Thinkly
      </button>
    </sc-if>
  </main>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":960,"height":640}}'>
class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.state = { mode: 'open' };
  }
  renderVals() {
    const m = this.state.mode;
    return {
      open: m === 'open',
      folded: m === 'folded',
      fold: () => this.setState({ mode: 'folded' }),
      unfold: () => this.setState({ mode: 'open' }),
      dismiss: () => this.setState({ mode: 'gone' })
    };
  }
}
</script>
</body>
</html>
